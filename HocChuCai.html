<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu Game Học Chữ Cái Tiếng Việt - Bé Siêu Nhí</title>
  <style>
    body {
      font-family: Arial, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fecfef, #a1c4fd);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1, h2 {
      color: #d81e5b;
      margin: 10px 0 30px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.15);
      text-align: center;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1000px;
      width: 100%;
    }
    .game-btn {
      padding: 25px 20px;
      font-size: 2rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
      transition: all 0.3s;
    }
    .game-btn:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 18px 36px rgba(0,0,0,0.3);
    }
    .game-container {
      display: none;
      width: 100%;
      max-width: 1000px;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .back-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      padding: 10px 20px;
      font-size: 1.2rem;
      background: #f39c12;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
    .back-btn:hover { background: #e67e22; }

    /* Quiz Game */
    #quiz-game #quiz-question {
      font-size: 10rem;
      font-weight: bold;
      color: #2c3e50;
      margin: 30px 0 40px;
      text-shadow: 3px 3px 10px rgba(0,0,0,0.2);
    }
    #quiz-game .choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 900px;
      width: 100%;
    }
    #quiz-game .letter-btn {
      font-size: 5.5rem;
      aspect-ratio: 1;
      border: none;
      border-radius: 20px;
      background: white;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: all 0.2s;
    }
    #quiz-game .letter-btn:hover { transform: translateY(-6px); }
    #quiz-game .correct { background: #2ecc71 !important; color: white; transform: scale(1.1); }
    #quiz-game .wrong   { background: #e74c3c !important; color: white; transform: scale(0.92); }
    #quiz-game #quiz-score { font-size: 1.8rem; margin: 20px 0; }

    /* Memory Game */
    #memory-game #memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 600px;
      width: 100%;
      margin: 20px auto;
    }
    .memory-card {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.4s ease, background 0.3s;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      user-select: none;
    }
    .memory-card.flipped {
      background: white;
      color: #2c3e50;
      transform: scale(1.05);
    }
    .memory-card.matched {
      background: #2ecc71 !important;
      color: white !important;
      cursor: default;
      transform: scale(1.03);
      box-shadow: 0 10px 20px rgba(46,204,113,0.4);
    }
    .memory-card:hover:not(.flipped):not(.matched) {
      transform: scale(1.08);
    }
    #memory-moves { font-size: 1.6rem; margin: 15px 0; }

    /* Find Game */
    #find-game #target-letter {
      font-size: 9rem;
      color: #e74c3c;
      margin: 20px 0;
    }
    #find-game #find-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      max-width: 720px;
      margin: 0 auto 30px;
    }
    .find-cell {
      font-size: 3.8rem;
      aspect-ratio: 1;
      border: none;
      border-radius: 14px;
      background: white;
      box-shadow: 0 5px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .find-cell:hover { transform: scale(1.08); }
    .find-cell.found { background: #2ecc71 !important; color: white; cursor: default; }
    .find-cell.wrong  { background: #95a5a6; color: white; transform: scale(0.92); }
    #find-score { font-size: 1.8rem; margin: 20px 0; }

    @media (max-width: 768px) {
      h1 { font-size: 2.4rem; }
      #quiz-game #quiz-question { font-size: 7rem; }
      #quiz-game .choices { grid-template-columns: repeat(2, 1fr); }
      #memory-game #memory-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .memory-card { font-size: 3.2rem; }
      #find-game #find-grid { grid-template-columns: repeat(5, 1fr); }
      .find-cell { font-size: 2.8rem; }
    }
  </style>
</head>
<body>

  <div id="main-menu">
    <h1>🌈 Bé Học Chữ Cái Siêu Vui! 🌈</h1>
    <div class="menu">
      <button class="game-btn" onclick="startGame('quiz')">🎯 Chọn Chữ Đúng</button>
      <button class="game-btn" onclick="startGame('memory')">🧠 Tìm Đôi Giống Nhau</button>
      <button class="game-btn" onclick="startGame('find')">🔍 Tìm Hết Chữ Giống</button>
    </div>
  </div>

  <!-- Quiz -->
  <div id="quiz-game" class="game-container">
    <button class="back-btn" onclick="backToMenu()">← Menu</button>
    <h1>Chọn chữ đúng nhé!</h1>
    <div id="quiz-score">Điểm: <span id="quiz-point">0</span></div>
    <div id="quiz-question">A</div>
    <div class="choices" id="quiz-choices"></div>
    <button id="quiz-next" style="display:none; margin-top:30px; padding:14px 40px; font-size:1.5rem; background:#f39c12; color:white; border:none; border-radius:12px; cursor:pointer;">Tiếp tục →</button>
  </div>

  <!-- Memory -->
  <div id="memory-game" class="game-container">
    <button class="back-btn" onclick="backToMenu()">← Menu</button>
    <h2>Tìm đôi chữ cái giống nhau</h2>
    <div id="memory-moves">Số lần lật: <span id="moves-count">0</span></div>
    <div id="memory-grid"></div>
    <button id="memory-reset" style="margin-top:25px; padding:12px 35px; font-size:1.3rem; background:#e74c3c; color:white; border:none; border-radius:12px; cursor:pointer;">Chơi lại</button>
  </div>

  <!-- Find -->
  <div id="find-game" class="game-container">
    <button class="back-btn" onclick="backToMenu()">← Menu</button>
    <h1>Tìm hết chữ <span id="target-letter"></span></h1>
    <div id="find-score">Tìm được: <span id="find-count">0</span> / <span id="total-count">0</span></div>
    <div id="find-grid"></div>
    <button id="find-next" style="display:none; margin-top:25px; padding:14px 40px; font-size:1.4rem; background:#f39c12; color:white; border:none; border-radius:12px; cursor:pointer;">Màn tiếp theo →</button>
  </div>

<script>
  const letters = ['A','Ă','Â','B','C','D','Đ','E','Ê','G','H','I','K','L','M','N','O','Ô','Ơ','P','Q','R','S','T','U','Ư','V','X','Y'];

  let currentGame = '';

  function showSection(id) {
    document.querySelectorAll('#main-menu, .game-container').forEach(el => el.style.display = 'none');
    document.getElementById(id).style.display = 'flex';
  }

  function backToMenu() {
    showSection('main-menu');
    currentGame = '';
  }

  function startGame(game) {
    currentGame = game;
    showSection(game + '-game');
    if (game === 'quiz') initQuiz();
    else if (game === 'memory') initMemory();
    else if (game === 'find') initFind();
  }

  // ── Quiz ────────────────────────────────────────
  let quizScore = 0;
  let quizAnswer = '';
  function initQuiz() {
    quizScore = 0;
    document.getElementById('quiz-point').textContent = quizScore;
    newQuiz();
  }
  function newQuiz() {
    document.getElementById('quiz-next').style.display = 'none';
    document.getElementById('quiz-choices').innerHTML = '';
    quizAnswer = letters[Math.floor(Math.random() * letters.length)];
    document.getElementById('quiz-question').textContent = quizAnswer;

    let opts = [quizAnswer];
    while (opts.length < 4) {
      let w = letters[Math.floor(Math.random() * letters.length)];
      if (!opts.includes(w)) opts.push(w);
    }
    opts.sort(() => Math.random() - 0.5);

    opts.forEach(l => {
      let btn = document.createElement('button');
      btn.className = 'letter-btn';
      btn.textContent = l;
      btn.onclick = () => {
        if (l === quizAnswer) {
          btn.classList.add('correct');
          quizScore++;
          document.getElementById('quiz-point').textContent = quizScore;
          document.getElementById('quiz-next').style.display = 'block';
        } else {
          btn.classList.add('wrong');
          setTimeout(() => btn.classList.remove('wrong'), 700);
        }
      };
      document.getElementById('quiz-choices').appendChild(btn);
    });
  }
  document.getElementById('quiz-next').onclick = newQuiz;

  // ── Memory ──────────────────────────────────────
  let flipped = [];
  let matched = 0;
  let moves = 0;
  let cards = [];

  function initMemory() {
    resetMemory();
  }

  function resetMemory() {
    flipped = [];
    matched = 0;
    moves = 0;
    document.getElementById('moves-count').textContent = moves;
    generateCards();
  }

  function generateCards() {
    let selected = [];
    while (selected.length < 8) {
      let l = letters[Math.floor(Math.random() * letters.length)];
      if (!selected.includes(l)) selected.push(l);
    }
    let pairList = [];
    selected.forEach(l => { pairList.push(l, l); });
    pairList.sort(() => Math.random() - 0.5);
    cards = pairList;

    const grid = document.getElementById('memory-grid');
    grid.innerHTML = '';
    pairList.forEach((letter, i) => {
      const card = document.createElement('div');
      card.className = 'memory-card';
      card.dataset.index = i;
      card.onclick = () => flip(i, card);
      grid.appendChild(card);
    });
  }

  function flip(index, cardElem) {
    if (flipped.length === 2 || cardElem.classList.contains('flipped') || cardElem.classList.contains('matched')) return;

    cardElem.classList.add('flipped');
    cardElem.textContent = cards[index];
    flipped.push({index, elem: cardElem});

    if (flipped.length === 2) {
      moves++;
      document.getElementById('moves-count').textContent = moves;
      setTimeout(checkMatch, 900);
    }
  }

  function checkMatch() {
    const [c1, c2] = flipped;
    if (cards[c1.index] === cards[c2.index]) {
      c1.elem.classList.add('matched');
      c2.elem.classList.add('matched');
      matched += 2;
      if (matched === 16) {
        setTimeout(() => {
          alert(`🎉 Bé giỏi quá! Hoàn thành với ${moves} lần lật!`);
          resetMemory();
        }, 400);
      }
    } else {
      c1.elem.classList.remove('flipped');
      c2.elem.classList.remove('flipped');
      c1.elem.textContent = '';
      c2.elem.textContent = '';
    }
    flipped = [];
  }

  document.getElementById('memory-reset').onclick = resetMemory;

  // ── Find ────────────────────────────────────────
  let findTarget = '';
  let findTotal = 0;
  let findCount = 0;

  function initFind() {
    newFindLevel();
  }

  function newFindLevel() {
    document.getElementById('find-next').style.display = 'none';
    findTarget = letters[Math.floor(Math.random() * letters.length)];
    document.getElementById('target-letter').textContent = findTarget;

    findTotal = Math.floor(Math.random() * 4) + 5; // 5–8
    findCount = 0;
    document.getElementById('find-count').textContent = 0;
    document.getElementById('total-count').textContent = findTotal;

    let data = [];
    let placed = 0;
    for (let i = 0; i < 30; i++) {
      if (placed < findTotal && Math.random() < 0.28) {
        data.push(findTarget);
        placed++;
      } else {
        let w;
        do { w = letters[Math.floor(Math.random() * letters.length)]; } while (w === findTarget);
        data.push(w);
      }
    }
    data.sort(() => Math.random() - 0.5);

    const grid = document.getElementById('find-grid');
    grid.innerHTML = '';
    data.forEach((ch, i) => {
      let btn = document.createElement('button');
      btn.className = 'find-cell';
      btn.textContent = ch;
      btn.onclick = () => {
        if (ch === findTarget && !btn.classList.contains('found')) {
          btn.classList.add('found');
          findCount++;
          document.getElementById('find-count').textContent = findCount;
          if (findCount === findTotal) {
            document.getElementById('find-next').style.display = 'block';
          }
        } else if (ch !== findTarget) {
          btn.classList.add('wrong');
          setTimeout(() => btn.classList.remove('wrong'), 600);
        }
      };
      grid.appendChild(btn);
    });
  }
  document.getElementById('find-next').onclick = newFindLevel;

  // Khởi động menu
  showSection('main-menu');
</script>
</body>
</html>
