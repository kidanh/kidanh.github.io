<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Bé Học Chữ Cái Siêu Vui - iPad</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #ffe066, #ff9a9e, #a1c4fd);
      background-size: 300% 300%;
      animation: gradient 18s ease infinite;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333;
      touch-action: manipulation; /* Giảm delay chạm trên iPad */
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1, h2 {
      color: #d63031;
      font-size: 3.2rem;
      margin: 20px 0 30px;
      text-align: center;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }
    .menu {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      width: 90%;
      max-width: 700px;
      padding: 20px 0;
    }
    .game-btn {
      padding: 35px 20px;
      font-size: 2.4rem;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #6c5ce7, #0984e3);
      color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .game-btn:active {
      transform: scale(0.96);
    }
    .game-container {
      display: none;
      width: 100%;
      max-width: 900px;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      padding: 18px 36px;
      font-size: 1.6rem;
      background: #fdcb6e;
      color: #2d3436;
      border: none;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .back-btn:active { transform: scale(0.95); }

    /* Quiz */
    #quiz-game #quiz-question {
      font-size: 12rem;
      font-weight: bold;
      color: #2d3436;
      margin: 40px 0 50px;
      text-shadow: 3px 3px 10px rgba(0,0,0,0.2);
    }
    #quiz-game .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      width: 90%;
      max-width: 700px;
    }
    #quiz-game .letter-btn {
      font-size: 7rem;
      aspect-ratio: 1;
      border: none;
      border-radius: 28px;
      background: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: all 0.18s;
    }
    #quiz-game .letter-btn:active { transform: scale(0.92); }
    #quiz-game .correct { background: #00b894 !important; color: white; transform: scale(1.08); }
    #quiz-game .wrong   { background: #e17055 !important; color: white; transform: scale(0.9); }
    #quiz-game #quiz-score { font-size: 2.2rem; margin: 20px 0; }
    #quiz-next {
      margin-top: 40px;
      padding: 20px 60px;
      font-size: 2rem;
      background: #fdcb6e;
      color: #2d3436;
      border: none;
      border-radius: 25px;
      display: none;
    }

    /* Memory - Tối ưu iPad */
    #memory-game #memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      width: 90%;
      max-width: 700px;
      margin: 30px auto;
    }
    .memory-card {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6rem;
      font-weight: bold;
      color: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      transition: transform 0.35s, background 0.25s;
      user-select: none;
    }
    .memory-card.flipped {
      background: white;
      color: #2d3436;
      transform: scale(1.06);
    }
    .memory-card.matched {
      background: #00b894 !important;
      color: white !important;
      transform: scale(1.04);
      box-shadow: 0 12px 30px rgba(0,184,148,0.4);
    }
    #memory-moves { font-size: 2rem; margin: 20px 0; }
    #memory-reset {
      margin-top: 40px;
      padding: 20px 50px;
      font-size: 1.8rem;
      background: #e17055;
      color: white;
      border: none;
      border-radius: 25px;
    }

    /* Find */
    #find-game #target-letter {
      font-size: 10rem;
      color: #d63031;
      margin: 30px 0;
    }
    #find-game #find-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      width: 90%;
      max-width: 800px;
      margin: 20px auto 40px;
    }
    .find-cell {
      font-size: 5rem;
      aspect-ratio: 1;
      border: none;
      border-radius: 20px;
      background: white;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      transition: all 0.18s;
    }
    .find-cell:active { transform: scale(0.92); }
    .find-cell.found { background: #00b894 !important; color: white; }
    .find-cell.wrong  { background: #636e72; color: white; transform: scale(0.9); }
    #find-score { font-size: 2.2rem; margin: 20px 0; }
    #find-next {
      margin-top: 40px;
      padding: 20px 60px;
      font-size: 2rem;
      background: #fdcb6e;
      color: #2d3436;
      border: none;
      border-radius: 25px;
      display: none;
    }

    @media (orientation: landscape) {
      .menu { grid-template-columns: repeat(3, 1fr); }
      #quiz-game .choices { grid-template-columns: repeat(4, 1fr); }
      #find-game #find-grid { grid-template-columns: repeat(6, 1fr); }
    }
  </style>
</head>
<body>

  <div id="main-menu">
    <h1>🌟 Bé Học Chữ Cái Vui Nhé! 🌟</h1>
    <div class="menu">
      <button class="game-btn" onclick="startGame('quiz')">🎯 Chọn Chữ Đúng</button>
      <button class="game-btn" onclick="startGame('memory')">🧠 Tìm Đôi Giống Nhau</button>
      <button class="game-btn" onclick="startGame('find')">🔍 Tìm Hết Chữ Giống</button>
    </div>
  </div>

  <!-- Quiz -->
  <div id="quiz-game" class="game-container">
    <button class="back-btn" onclick="backToMenu()">← Menu</button>
    <h1>Chọn chữ giống nhé!</h1>
    <div id="quiz-score">Điểm: <span id="quiz-point">0</span></div>
    <div id="quiz-question">A</div>
    <div class="choices" id="quiz-choices"></div>
    <button id="quiz-next">Tiếp tục →</button>
  </div>

  <!-- Memory -->
  <div id="memory-game" class="game-container">
    <button class="back-btn" onclick="backToMenu()">← Menu</button>
    <h2>Tìm đôi chữ cái</h2>
    <div id="memory-moves">Số lần lật: <span id="moves-count">0</span></div>
    <div id="memory-grid"></div>
    <button id="memory-reset">Chơi lại</button>
  </div>

  <!-- Find -->
  <div id="find-game" class="game-container">
    <button class="back-btn" onclick="backToMenu()">← Menu</button>
    <h1>Tìm hết chữ <span id="target-letter"></span></h1>
    <div id="find-score">Tìm được: <span id="find-count">0</span> / <span id="total-count">0</span></div>
    <div id="find-grid"></div>
    <button id="find-next">Màn tiếp theo →</button>
  </div>

<script>
  const letters = ['A','Ă','Â','B','C','D','Đ','E','Ê','G','H','I','K','L','M','N','O','Ô','Ơ','P','Q','R','S','T','U','Ư','V','X','Y'];

  let currentGame = '';

  function showSection(id) {
    document.querySelectorAll('#main-menu, .game-container').forEach(el => el.style.display = 'none');
    document.getElementById(id).style.display = 'flex';
  }

  function backToMenu() {
    showSection('main-menu');
    currentGame = '';
  }

  function startGame(game) {
    currentGame = game;
    showSection(game + '-game');
    if (game === 'quiz') initQuiz();
    else if (game === 'memory') initMemory();
    else if (game === 'find') initFind();
  }

  // Quiz
  let quizScore = 0;
  let quizAnswer = '';
  function initQuiz() {
    quizScore = 0;
    document.getElementById('quiz-point').textContent = quizScore;
    newQuiz();
  }
  function newQuiz() {
    document.getElementById('quiz-next').style.display = 'none';
    document.getElementById('quiz-choices').innerHTML = '';
    quizAnswer = letters[Math.floor(Math.random() * letters.length)];
    document.getElementById('quiz-question').textContent = quizAnswer;

    let opts = [quizAnswer];
    while (opts.length < 4) {
      let w = letters[Math.floor(Math.random() * letters.length)];
      if (!opts.includes(w)) opts.push(w);
    }
    opts.sort(() => Math.random() - 0.5);

    opts.forEach(l => {
      let btn = document.createElement('button');
      btn.className = 'letter-btn';
      btn.textContent = l;
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (l === quizAnswer) {
          btn.classList.add('correct');
          quizScore++;
          document.getElementById('quiz-point').textContent = quizScore;
          document.getElementById('quiz-next').style.display = 'block';
        } else {
          btn.classList.add('wrong');
          setTimeout(() => btn.classList.remove('wrong'), 600);
        }
      });
      document.getElementById('quiz-choices').appendChild(btn);
    });
  }
  document.getElementById('quiz-next').addEventListener('touchstart', (e) => {
    e.preventDefault();
    newQuiz();
  });

  // Memory
  let flipped = [];
  let matched = 0;
  let moves = 0;
  let cards = [];

  function initMemory() {
    resetMemory();
  }
  function resetMemory() {
    flipped = [];
    matched = 0;
    moves = 0;
    document.getElementById('moves-count').textContent = moves;
    generateCards();
  }
  function generateCards() {
    let selected = [];
    while (selected.length < 8) {
      let l = letters[Math.floor(Math.random() * letters.length)];
      if (!selected.includes(l)) selected.push(l);
    }
    let pairList = [];
    selected.forEach(l => pairList.push(l, l));
    pairList.sort(() => Math.random() - 0.5);
    cards = pairList;

    const grid = document.getElementById('memory-grid');
    grid.innerHTML = '';
    pairList.forEach((letter, i) => {
      const card = document.createElement('div');
      card.className = 'memory-card';
      card.dataset.index = i;
      card.addEventListener('touchstart', (e) => {
        e.preventDefault();
        flip(i, card);
      });
      grid.appendChild(card);
    });
  }
  function flip(index, cardElem) {
    if (flipped.length === 2 || cardElem.classList.contains('flipped') || cardElem.classList.contains('matched')) return;
    cardElem.classList.add('flipped');
    cardElem.textContent = cards[index];
    flipped.push({index, elem: cardElem});
    if (flipped.length === 2) {
      moves++;
      document.getElementById('moves-count').textContent = moves;
      setTimeout(checkMatch, 900);
    }
  }
  function checkMatch() {
    const [c1, c2] = flipped;
    if (cards[c1.index] === cards[c2.index]) {
      c1.elem.classList.add('matched');
      c2.elem.classList.add('matched');
      matched += 2;
      if (matched === 16) {
        setTimeout(() => {
          alert(`Hoàn thành! Bé giỏi quá!\nSố lần lật: ${moves}`);
          resetMemory();
        }, 500);
      }
    } else {
      c1.elem.classList.remove('flipped');
      c2.elem.classList.remove('flipped');
      c1.elem.textContent = '';
      c2.elem.textContent = '';
    }
    flipped = [];
  }
  document.getElementById('memory-reset').addEventListener('touchstart', (e) => {
    e.preventDefault();
    resetMemory();
  });

  // Find
  let findTarget = '';
  let findTotal = 0;
  let findCount = 0;

  function initFind() {
    newFindLevel();
  }
  function newFindLevel() {
    document.getElementById('find-next').style.display = 'none';
    findTarget = letters[Math.floor(Math.random() * letters.length)];
    document.getElementById('target-letter').textContent = findTarget;
    findTotal = Math.floor(Math.random() * 4) + 6; // 6-9 cho iPad
    findCount = 0;
    document.getElementById('find-count').textContent = 0;
    document.getElementById('total-count').textContent = findTotal;

    let data = [];
    let placed = 0;
    for (let i = 0; i < 35; i++) {  // tăng lên 35 ô cho iPad
      if (placed < findTotal && Math.random() < 0.3) {
        data.push(findTarget);
        placed++;
      } else {
        let w;
        do { w = letters[Math.floor(Math.random() * letters.length)]; } while (w === findTarget);
        data.push(w);
      }
    }
    data.sort(() => Math.random() - 0.5);

    const grid = document.getElementById('find-grid');
    grid.innerHTML = '';
    data.forEach((ch, i) => {
      let btn = document.createElement('button');
      btn.className = 'find-cell';
      btn.textContent = ch;
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (ch === findTarget && !btn.classList.contains('found')) {
          btn.classList.add('found');
          findCount++;
          document.getElementById('find-count').textContent = findCount;
          if (findCount === findTotal) {
            document.getElementById('find-next').style.display = 'block';
          }
        } else if (ch !== findTarget) {
          btn.classList.add('wrong');
          setTimeout(() => btn.classList.remove('wrong'), 500);
        }
      });
      grid.appendChild(btn);
    });
  }
  document.getElementById('find-next').addEventListener('touchstart', (e) => {
    e.preventDefault();
    newFindLevel();
  });

  // Khởi động
  showSection('main-menu');
</script>
</body>
</html>
